<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Invoice · NP-Shop</title>
<style>
:root{--ink:#111;--muted:#555;--line:#9a9a9a}
*{box-sizing:border-box}
body{margin:0;background:#efefef;color:var(--ink);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{padding:24px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
.receipt{position:relative;width:100%;max-width:340px;background:#fff;padding:28px 16px 36px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(-45deg,transparent 8px,#fff 0) 0 0/16px 12px repeat-x,linear-gradient(45deg,transparent 8px,#fff 0) 0 0/16px 12px repeat-x}
.c{text-align:center}
.km{display:block;font-family:"Kantumruy Pro",system-ui,sans-serif;font-size:.8em;font-weight:500;color:#666;line-height:1.35;letter-spacing:0}
.kmi{font-family:"Kantumruy Pro",system-ui,sans-serif;font-weight:500;color:#555}
.title .km{color:#111;font-size:.95em;letter-spacing:0;margin-top:1px}
.stamp .km{color:inherit;font-size:.6em;letter-spacing:0;margin-top:2px}
th .km{font-weight:600}
.total .km{font-size:.65em}
.shop{font-size:22px;font-weight:800;letter-spacing:-.01em}
.desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.title{display:inline-block;font-size:13px;font-weight:700;margin:14px 0 10px;letter-spacing:.18em;padding:4px 12px;border:1.5px solid #111;border-radius:999px}
.meta{font-size:12.5px}
.cust{margin-top:14px;font-size:12.5px}
.cust div{display:flex;gap:6px}.cust b{flex:none;width:74px;font-weight:600}
.dash{border:0;border-top:2px dashed var(--line);margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px}
th{text-align:left;font-weight:800;padding:0 0 6px}
th.n,td.n{text-align:right;white-space:nowrap}
th.q,td.q{text-align:center;width:36px}
.item td{padding:2px 0}
.iname{padding-top:8px!important;word-break:break-word;font-weight:700;font-size:13px}
.pn{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.sep td{padding:0}.sep hr{border:0;border-top:2px dashed var(--line);margin:6px 0 0}
.sum{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.sum.disc > span:last-child{color:#c62828;font-weight:600}
.was{display:block;font-size:11px;color:var(--muted);text-decoration:line-through}
.total{font-size:17px;font-weight:800;padding:6px 0}
.pay{margin-top:10px;font-size:12.5px}
.stamp{display:inline-block;margin-top:14px;padding:4px 14px;border:3px solid #1b8a3a;color:#1b8a3a;font-weight:800;font-size:18px;letter-spacing:.12em;transform:rotate(-6deg);border-radius:6px}
.stamp.unpaid{border-color:#c62828;color:#c62828}
.thanks{margin-top:22px;font-size:11.5px}
.btns{display:flex;gap:10px}
.btns button{font:600 14px "Inter",system-ui,sans-serif;padding:11px 18px;border-radius:999px;border:0;background:#111;color:#fff}
.err{max-width:340px;background:#fff;padding:20px;text-align:center}
@media print{body{background:#fff}.btns{display:none}.receipt{box-shadow:none}.wrap{padding:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* Invoice data travels in the URL hash (base64url JSON), so it never reaches a server.
   Shape: { n:"000001", t:"2026-11-20T21:54:00+07:00", name, phone, addr,
            items:[[name, partNumber, price, qty, salePrice?]], disc?:number (extra discount $),
            fee:number|null, pay:"transfer"|"cod", paid:true } */
const SHOP = { name: "NP-Shop", desc: "Survey equipment & Garmin watches", phone: "+855 17 303 337 · +855 12 859 788" };
const app = document.getElementById("app");
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const bi = (en, km) => { const s = h("span"); s.append(document.createTextNode(en), h("span", "km", km)); return s; };
const ki = (en, km) => { const s = h("span"); s.append(document.createTextNode(en + " "), h("span", "kmi", "(" + km + ")")); return s; };
const fmt = n => Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function decode(s){
  s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const bin = atob(s), bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
let d = null;
try { d = decode(location.hash.slice(1)); } catch {}
if (!d || !Array.isArray(d.items)){
  app.appendChild(h("div", "err", "This invoice link is incomplete. Please open it again from the message our bot sent you."));
} else {
  const when = d.t ? new Date(d.t) : new Date();
  const r = h("div", "receipt");
  const top = h("div", "c");
  top.append(h("div", "shop", SHOP.name), h("div", "desc", SHOP.desc), (() => { const t = h("div", "title"); t.appendChild(bi("E-INVOICE", "វិក្កយបត្រ")); return t; })());
  const meta = h("div", "meta");
  meta.append(
    (() => { const x = h("div"); x.append(ki("Invoice No.", "លេខវិក្កយបត្រ"), document.createTextNode(": #" + String(d.n || "").padStart(6, "0"))); return x; })(),
    (() => { const x = h("div"); x.append(ki("Date", "កាលបរិច្ឆេទ"), document.createTextNode(": " + when.toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric", timeZone: "Asia/Phnom_Penh" }))); return x; })(),
    (() => { const x = h("div"); x.append(ki("Time", "ម៉ោង"), document.createTextNode(": " + when.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Phnom_Penh" }))); return x; })()
  );
  top.appendChild(meta); r.appendChild(top);

  const cust = h("div", "cust");
  const row = (k, km, v) => { if (!v) return; const x = h("div"), b = h("b"); b.appendChild(bi(k, km)); x.append(b, h("span", "", v)); cust.appendChild(x); };
  row("Customer", "អតិថិជន", d.name); row("Phone", "ទូរស័ព្ទ", d.phone); row("Deliver to", "ដឹកជញ្ជូនទៅ", d.addr);
  if (cust.children.length){ r.appendChild(h("hr", "dash")); r.appendChild(cust); }

  const t = h("table"), hr = h("tr");
  const th = (cls, en, km) => { const x = h("th", cls); x.appendChild(bi(en, km)); return x; };
  hr.append(th("", "Product", "ទំនិញ"), th("n", "Price", "តម្លៃ"), th("q", "QTY", "ចំនួន"), th("n", "Amount", "ទឹកប្រាក់"));
  const thead = h("thead"); thead.appendChild(hr); t.appendChild(thead);
  const tb = h("tbody"); const sepRow = () => { const s = h("tr", "sep"), c = h("td"); c.colSpan = 4; c.appendChild(h("hr")); s.appendChild(c); return s; };
  tb.appendChild(sepRow());
  let sub = 0, itemDisc = 0;
  d.items.forEach(([name, pn, rate, qty, sale], i) => {
    const amt = Number(rate) * Number(qty); sub += amt;
    if (typeof sale === "number" && sale < rate) itemDisc += (rate - sale) * Number(qty);
    const a = h("tr", "item"), nc = h("td", "iname"); nc.colSpan = 4; nc.textContent = (i + 1) + "." + name;
    if (pn) nc.appendChild(h("span", "pn", "P/N " + pn));
    a.appendChild(nc); tb.appendChild(a);
    const b = h("tr", "item"); b.append(h("td"), h("td", "n", fmt(rate)), h("td", "q", String(qty)), h("td", "n", fmt(amt)));
    tb.appendChild(b); tb.appendChild(sepRow());
  });
  t.appendChild(tb); r.appendChild(t);

  const fee = typeof d.fee === "number" ? d.fee : 0;
  const disc = Math.round((itemDisc + (Number(d.disc) || 0)) * 100) / 100;
  const sums = h("div");
  const line = (k, v, cls) => { const x = h("div", "sum" + (cls ? " " + cls : "")); const l = h("span"); l.appendChild(k); x.append(l, h("span", "", v)); sums.appendChild(x); };
  line(ki("Subtotal", "សរុបរង"), "$" + fmt(sub));
  line(ki("Discount", "បញ្ចុះតម្លៃ"), disc ? "−$" + fmt(disc) : "$0.00", "disc");
  line(ki("Delivery", "ថ្លៃដឹកជញ្ជូន"), typeof d.fee === "number" ? "$" + fmt(fee) : "—");
  sums.appendChild(h("hr", "dash"));
  line(ki("Total", "សរុបរួម"), "$" + fmt(sub - disc + fee), "total");
  sums.appendChild(h("hr", "dash"));
  r.appendChild(sums);

  const pay = h("div", "pay c");
  const pm = h("div"); pm.append(ki("Payment", "ការទូទាត់"), document.createTextNode(": "), d.pay === "cod" ? ki("Cash on Delivery", "បង់ប្រាក់ពេលទទួលទំនិញ") : ki("Bank Transfer", "ផ្ទេរតាមធនាគារ")); pay.appendChild(pm);
  const st = h("div", "stamp" + (d.paid ? "" : " unpaid")); st.appendChild(d.paid ? bi("PAID", "បានបង់ប្រាក់") : bi("UNPAID", "មិនទាន់បង់")); pay.appendChild(st);
  r.appendChild(pay);

  const foot = h("div", "thanks c");
  foot.append(h("div", "", "Thank you for your purchase!"), h("div", "kmi", "សូមអរគុណសម្រាប់ការទិញទំនិញ!"), h("div", "", SHOP.phone));
  r.appendChild(foot);
  app.appendChild(r);

  const btns = h("div", "btns"), pr = h("button", "", "Save / Print");
  pr.onclick = () => window.print(); btns.appendChild(pr); app.appendChild(btns);
  document.title = "Invoice #" + String(d.n || "").padStart(6, "0") + " · " + SHOP.name;
}
</script>
</body>
</html>
