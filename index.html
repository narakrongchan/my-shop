<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="s1.css?v=4">
<link rel="stylesheet" href="s2.css?v=4">
</head>
<body>
<header id="top">
  <h1 id="shopName">Shop</h1>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section id="catalog">
    <div class="grid" id="grid"><div class="empty">Loading products…</div></div>
  </section>

  <section id="product" hidden></section>

  <section id="checkout" hidden>
    <button class="back" id="backBtn" type="button">‹ Back to products</button>
    <div class="section"><h2>Your order</h2><div id="lines"></div><div id="sums"></div></div>
    <form class="section" id="form" novalidate>
      <h2>Delivery details</h2>
      <label for="fName">Full name<input id="fName" autocomplete="name" required></label>
      <label for="fPhone">Phone number<input id="fPhone" type="tel" autocomplete="tel" required></label>
      <label for="fAddr">Delivery address<textarea id="fAddr" rows="2" autocomplete="street-address" required></textarea></label>
      <label for="fNote">Note for the shop (optional)<input id="fNote" maxlength="200"></label>
      <label for="fPay">Payment<select id="fPay"></select></label>
      <p class="err" id="formErr" hidden></p>
    </form>
  </section>
</main>

<p class="note" id="outside" hidden>You're viewing the shop outside Telegram. Orders can only be placed from inside the bot.</p>
<div class="toast" id="toast" role="status" hidden></div>
<div class="fallbar" id="fallbar" hidden>
  <button class="fback" id="fallBack" type="button" aria-label="Back" hidden>‹</button>
  <button class="fmain" id="fallBtn" type="button"></button>
</div>

<script src="a1.js?v=4"></script>
<script src="a2.js?v=4"></script>
<script src="a3.js?v=4"></script>
<script src="a4.js?v=4"></script>
</body>
</html>
